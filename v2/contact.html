<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto :: Portafolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="../img/O.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body data-page="contact" data-tty="ttys005">
    <main class="terminal-body">
        <div class="terminal-line">
            <span class="terminal-login"></span>
        </div>

        <div class="language-switch" role="group" aria-label="Selector de idioma" data-i18n-aria-label="common.languageLabel">
            <button type="button" class="language-switch__button" data-language-option="es">ES</button>
            <button type="button" class="language-switch__button" data-language-option="en">EN</button>
        </div>

        <div class="terminal-prompt">
            <span class="prompt-symbol">&gt;</span>
            <span class="prompt-command">cat navigation.txt</span>
        </div>

        <nav class="terminal-nav">
            <a href="../index.html" data-i18n="common.nav.home">[ Inicio ]</a>
            <a href="about.html" data-i18n="common.nav.about">[ Sobre mí ]</a>
            <a href="projects.html" data-i18n="common.nav.projects">[ Proyectos ]</a>
            <a href="certificates.html" data-i18n="common.nav.certificates">[ Certificados ]</a>
            <a href="contact.html" data-i18n="common.nav.contact">[ Contacto ]</a>
        </nav>

        <div class="terminal-prompt">
            <span class="prompt-symbol">&gt;</span>
            <span class="prompt-command">./run-contact-form.sh</span>
        </div>

        <div class="terminal-box terminal-form-box">
            <h1 class="presentacion__contenido__titulo" data-i18n="contact.pageTitle">Contacto</h1>
            <p class="presentacion__contenido__texto" data-i18n="contact.intro">¿Interesado en colaborar? Envíame un mensaje.</p>

            <form id="contact-form" class="terminal-form" action="https://formspree.io/f/mldoqkrq" method="POST">
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="contact.email">Tu Email:</label>
                    <input class="form-input" type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="subject" data-i18n="contact.subject">Asunto:</label>
                    <input class="form-input" type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="message" data-i18n="contact.message">Mensaje:</label>
                    <textarea class="form-textarea" id="message" name="message" rows="6" required></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="form-submit" data-i18n="contact.submit">[ Enviar Mensaje ]</button>
                </div>
            </form>

            <p id="form-status" class="form-status"></p>
        </div>

        <div class="terminal-output terminal-footer">
            <p data-i18n="common.footer">(c) 2025 Giovanni López. Todos los derechos reservados.</p>
        </div>

        <div class="terminal-prompt terminal-prompt--final">
            <span class="prompt-symbol">&gt;</span>
            <span class="cursor">_</span>
        </div>
    </main>

    <script src="../scripts/i18n.js"></script>
</body>
</html>
